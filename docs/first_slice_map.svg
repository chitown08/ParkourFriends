<svg xmlns="http://www.w3.org/2000/svg" viewBox="-125 -195 345 320" width="100%" font-family="Segoe UI, Arial, sans-serif">
  <title>Parkour Friends: first slice map (top-down, 1 unit = 1 m)</title>
  <style>
    .sky { fill: #dcebf7; }
    .island { fill: #c9c4b6; stroke: #8f8a7c; stroke-width: 0.8; }
    .greek { fill: #e3d9bf; stroke: #a8996f; stroke-width: 0.8; }
    .bonus { fill: #cfe3c8; stroke: #6f9a63; stroke-width: 0.8; stroke-dasharray: 3 2; }
    .bldg { fill: #8e96a3; stroke: #5d6470; stroke-width: 0.5; }
    .tall { fill: #6c7482; }
    .temple { fill: #d8c48f; stroke: #8f7b45; stroke-width: 0.5; }
    .plaza { fill: #e9e4d6; stroke: #8f8a7c; stroke-width: 0.4; }
    .h { font-size: 4.2px; fill: #fff; font-weight: 600; text-anchor: middle; }
    .hd { font-size: 4.2px; fill: #3d3a33; font-weight: 600; text-anchor: middle; }
    .name { font-size: 6px; fill: #2b2f36; font-weight: 700; text-anchor: middle; }
    .note { font-size: 3.8px; fill: #3d4350; text-anchor: middle; }
    .noteL { font-size: 3.8px; fill: #3d4350; }
    .route { fill: none; stroke-width: 1.2; }
    .glide { stroke: #2f7fd1; stroke-dasharray: 4 2.5; }
    .bridge { stroke: #7a5a2c; stroke-width: 3; }
    .toss { stroke: #b0399c; stroke-dasharray: 1.5 1.5; }
    .easy { fill: #3ca34a; stroke: #fff; stroke-width: 0.6; }
    .med { fill: #e39b1c; stroke: #fff; stroke-width: 0.6; }
    .hard { fill: #d63c3c; stroke: #fff; stroke-width: 0.6; }
    .legend { fill: #ffffff; fill-opacity: 0.85; stroke: #9aa3ae; stroke-width: 0.4; }
  </style>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7fd1"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0399c"/>
    </marker>
  </defs>

  <rect class="sky" x="-125" y="-195" width="345" height="320"/>
  <text class="name" x="47" y="-184" style="font-size:8px">First slice: Old Town hub + Ancient Greece island</text>
  <text class="note" x="47" y="-177">Top-down view. Numbers on buildings = height in metres above the hub's streets.</text>

  <!-- ===== Sky Garden (bonus islet) ===== -->
  <ellipse class="bonus" cx="0" cy="-138" rx="27" ry="16"/>
  <text class="name" x="0" y="-142">Sky Garden</text>
  <text class="note" x="0" y="-136">BONUS · floats at +55 m</text>
  <text class="note" x="0" y="-131.5">3+ players: toss chain</text>
  <circle class="hard" cx="20" cy="-147" r="2.4"/>
  <path class="route toss" d="M 0,-50 L 0,-124" marker-end="url(#arrowPink)"/>
  <text class="noteL" x="2.5" y="-95">toss chain from the</text>
  <text class="noteL" x="2.5" y="-90.5">Clock Tower top</text>

  <!-- ===== Old Town hub island ===== -->
  <rect class="island" x="-82" y="-82" width="164" height="164" rx="22"/>
  <text class="name" x="-60" y="-70" style="text-anchor:start">OLD TOWN</text>
  <text class="noteL" x="-60" y="-65">city hub · streets at 0 m</text>

  <!-- streets/plaza -->
  <circle class="plaza" cx="0" cy="30" r="13"/>
  <text class="name" x="0" y="29">SPAWN</text>
  <text class="note" x="0" y="34">plaza + fountain</text>

  <!-- buildings: x/y = top-left corner in metres -->
  <rect class="bldg" x="-60" y="28" width="20" height="24"/><text class="h" x="-50" y="41.5">6</text>
  <text class="note" x="-50" y="57">shops</text>
  <rect class="bldg" x="-64" y="-15" width="18" height="30"/><text class="h" x="-55" y="1.5">12</text>
  <rect class="bldg tall" x="-62" y="-55" width="24" height="20"/><text class="h" x="-50" y="-43.5">20</text>
  <text class="note" x="-50" y="-58">apartments</text>
  <text class="note" x="-55" y="-23.5">wall-run alley</text>
  <rect class="bldg" x="-27" y="-17" width="10" height="14"/><text class="h" x="-22" y="-8.5">10</text>
  <rect class="bldg" x="10" y="-20" width="10" height="10"/><text class="h" x="15" y="-13.5">14</text>
  <rect class="bldg" x="-27" y="54" width="14" height="12"/><text class="h" x="-20" y="61.5">4</text>
  <rect class="bldg" x="14" y="56" width="12" height="12"/><text class="h" x="20" y="63.5">5</text>
  <rect class="bldg" x="29" y="36" width="22" height="18"/><text class="h" x="40" y="46.5">8</text>
  <rect class="bldg" x="35" y="-8" width="20" height="26"/><text class="h" x="45" y="6.5">15</text>
  <text class="note" x="45" y="22">glider roof</text>
  <rect class="bldg tall" x="36" y="-56" width="18" height="22"/><text class="h" x="45" y="-43.5">25</text>
  <text class="note" x="45" y="-59">offices</text>

  <!-- Clock Tower landmark -->
  <rect class="bldg tall" x="-6" y="-46" width="12" height="12" style="fill:#4b5260"/>
  <text class="h" x="-1.5" y="-38.5">40</text>
  <text class="name" x="0" y="-50">Clock Tower</text>

  <!-- Glider pickup -->
  <path d="M 45,-1 L 51,3 L 45,1.6 L 39,3 Z" fill="#2f7fd1" stroke="#fff" stroke-width="0.5"/>
  <text class="note" x="45" y="-3" style="fill:#1d5ea3;font-weight:700">GLIDER</text>

  <!-- ===== Ancient Greece island ===== -->
  <ellipse class="greek" cx="155" cy="0" rx="45" ry="42"/>
  <text class="name" x="155" y="-48">ANCIENT GREECE</text>
  <text class="note" x="155" y="-53">ground at -10 m (lower than Old Town)</text>
  <rect class="temple" x="143" y="-16" width="30" height="20"/>
  <text class="hd" x="158" y="-6.5">18</text>
  <text class="note" x="158" y="-1.5">temple</text>
  <!-- columns -->
  <g fill="#b8a46c">
    <circle cx="140" cy="-22" r="1.6"/><circle cx="148" cy="-22" r="1.6"/><circle cx="156" cy="-22" r="1.6"/><circle cx="164" cy="-22" r="1.6"/><circle cx="172" cy="-22" r="1.6"/>
    <circle cx="176" cy="22" r="1.6"/><circle cx="182" cy="16" r="1.6"/><circle cx="186" cy="8" r="1.6"/>
  </g>
  <text class="note" x="181" y="28">columns (hop between tops)</text>
  <!-- broken stairway -->
  <g fill="#cbb98a" stroke="#8f7b45" stroke-width="0.3">
    <rect x="122" y="14" width="6" height="8"/><rect x="129" y="14" width="6" height="8"/><rect x="138" y="14" width="6" height="8"/>
  </g>
  <text class="note" x="126" y="27">broken stairway</text>
  <circle class="plaza" cx="150" cy="28" r="7"/>
  <text class="note" x="150" y="29.5">agora</text>

  <!-- ===== Routes between islands ===== -->
  <path class="route glide" d="M 55,4 C 80,0 100,2 120,6" marker-end="url(#arrowBlue)"/>
  <text class="note" x="86" y="11" style="fill:#1d5ea3">glide from the</text>
  <text class="note" x="86" y="15.2" style="fill:#1d5ea3">glider roof</text>
  <!-- broken bridge -->
  <path class="route bridge" d="M 82,-30 L 88,-30 M 96,-30 L 100,-30 M 108,-30 L 113,-30"/>
  <text class="note" x="97" y="-35">broken bridge</text>
  <text class="note" x="97" y="-25">gaps too wide alone:</text>
  <text class="note" x="97" y="-21">toss each other across</text>

  <!-- ===== Relics ===== -->
  <!-- easy -->
  <circle class="easy" cx="11" cy="20" r="2.2"/>
  <circle class="easy" cx="-36" cy="70" r="2.2"/>
  <circle class="easy" cx="62" cy="68" r="2.2"/>
  <circle class="easy" cx="150" cy="35" r="2.2"/>
  <!-- medium -->
  <circle class="med" cx="-50" cy="10" r="2.2"/>
  <circle class="med" cx="47" cy="50" r="2.2"/>
  <circle class="med" cx="138" cy="18" r="2.2"/>
  <circle class="med" cx="186" cy="8" r="2.2"/>
  <!-- hard -->
  <circle class="hard" cx="3.2" cy="-36.8" r="1.9"/>
  <circle class="hard" cx="168" cy="-12" r="2.4"/>
  <circle class="hard" cx="-41.5" cy="-38.5" r="2.2"/>

  <!-- ===== Legend ===== -->
  <rect class="legend" x="102" y="52" width="112" height="66" rx="2"/>
  <text class="noteL" x="106" y="59" style="font-weight:700;font-size:4.4px">Legend</text>
  <circle class="easy" cx="109" cy="65" r="2"/><text class="noteL" x="113" y="66.3">relic: easy (street level)</text>
  <circle class="med" cx="109" cy="71" r="2"/><text class="noteL" x="113" y="72.3">relic: medium (rooftops, side paths)</text>
  <circle class="hard" cx="109" cy="77" r="2"/><text class="noteL" x="113" y="78.3">relic: hard (summits, friends, items)</text>
  <path d="M 108,82.5 L 111.5,85.5 L 108,84.6 L 104.5,85.5 Z" fill="#2f7fd1"/><text class="noteL" x="113" y="85.5">item to find (glider)</text>
  <line class="route glide" x1="105" y1="91" x2="111" y2="91"/><text class="noteL" x="113" y="92.3">glide route (solo-friendly)</text>
  <line class="route bridge" x1="105" y1="97" x2="111" y2="97" style="stroke-width:2"/><text class="noteL" x="113" y="98.3">broken bridge (co-op route)</text>
  <line class="route toss" x1="105" y1="103" x2="111" y2="103"/><text class="noteL" x="113" y="104.3">toss route (needs friends)</text>
  <rect class="bonus" x="105" y="107.5" width="6" height="4"/><text class="noteL" x="113" y="111">bonus island (3+ players)</text>

  <!-- compass + scale -->
  <g transform="translate(-108,-160)">
    <path d="M 0,-9 L 3.5,3 L 0,0.5 L -3.5,3 Z" fill="#2b2f36"/>
    <text class="name" x="0" y="10" style="font-size:5px">N</text>
  </g>
  <text class="noteL" x="-100" y="-165">north = the way the</text>
  <text class="noteL" x="-100" y="-161">test course runs</text>
  <g transform="translate(-115,112)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2b2f36" stroke-width="0.8"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#2b2f36" stroke-width="0.8"/>
    <line x1="25" y1="-1.5" x2="25" y2="1.5" stroke="#2b2f36" stroke-width="0.6"/>
    <line x1="50" y1="-2" x2="50" y2="2" stroke="#2b2f36" stroke-width="0.8"/>
    <text class="noteL" x="0" y="-3.5">0</text>
    <text class="noteL" x="44" y="-3.5">50 m</text>
  </g>
</svg>
